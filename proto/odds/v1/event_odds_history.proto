syntax = "proto3";

package odds.v1;

import "google/protobuf/timestamp.proto";

// Veikkaus basketball only.
message EventOddsHistory {
  string event_id = 1;
  string home_name = 2;
  string away_name = 3;
  repeated OddsChange odds_changes = 4;
}

// One selection's state, keyed by (event_id, market_id, side).
message OddsChange {
  google.protobuf.Timestamp observed_at = 1;
  // Keeps separate markets/periods distinct, including regulation vs overtime.
  string market_id = 2;
  OddsType odds_type = 3;
  OutcomeSide side = 4;
  // Exact quoted decimal text, retained even when inactive; absent means no quote.
  optional string decimal_odds = 5;
  // Signed decimal text: empty for winning, one value for a single handicap,
  // two source components for a split handicap. Preserve source ordering.
  repeated string handicap = 6;
  // Derived from event, market and selection flags/status; not just outcome.active.
  bool active = 7;
}

enum OddsType {
  ODDS_TYPE_WINNING = 0;
  ODDS_TYPE_HANDICAP = 1;
}

enum OutcomeSide {
  OUTCOME_SIDE_HOME = 0;
  OUTCOME_SIDE_AWAY = 1;
  OUTCOME_SIDE_DRAW = 2;
}
